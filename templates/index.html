<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLV Builders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container py-5">

    <div class="main-card">

        <div class="text-center mb-4">
            <h1 class="company-title">
                SLV BUILDERS
            </h1>

            <p class="subtitle">
                Agreement & Quotation Generator
            </p>
        </div>

    <form action="/generate" method="POST">

        <h4>Client Information</h4>

        <div class="mb-3">
            <label class="form-label">Client Name</label>
            <input
                id="clientName"
                name="client_name"
                type="text"
                class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input
                id="phoneNumber"
                name="phone_number"
                type="text"
                class="form-control">
        </div>

        <div class="mb-4">
            <label class="form-label">Property Address</label>
            <textarea
                id="propertyAddress"
                name="property_address"
                class="form-control"
                rows="3"></textarea>
        </div>

        <h4>Construction Details</h4>

        <div class="row">

            <div class="col-md-4 mb-3">
                <input
                    id="sqft"
                    name="sqft"
                    type="number"
                    class="form-control"
                    placeholder="Sqft / Floor">

            </div>

            <div class="col-md-4 mb-3">
                <input
                    id="floors"
                    name="floors"
                    type="number"
                    class="form-control"
                    placeholder="No. of Floors">
            </div>

            <div class="col-md-4 mb-3">
                <input
                    id="rate"
                    name="rate"
                    type="number"
                    class="form-control"
                    placeholder="Rate / Sqft">
            </div>

        </div>

        <button
            type="button"
            class="btn calculate-btn"
            onclick="calculateEstimate()">

            Calculate Estimate

        </button>

    <div id="resultSection" style="display:none;">

    <div class="result-card">
        <h3>Total Built-up Area</h3>
        <h2 id="totalArea">0</h2>
    </div>

    <div class="result-card">
        <h3>Construction Cost</h3>
        <h2 id="totalCost">₹0</h2>
    </div>
    
    <div class="result-card">
        <h3>Project Value (Crores)</h3>
        <h2 id="projectCrore">₹0 Cr</h2>
    </div>

    <div class="mt-4">

    <button
        type="submit"
        class="btn generate-btn">

        Generate Agreement

    </button>
</form>

</div>

</div>
</div>

</div>
<script>

function calculateEstimate() {

    let sqft =
        Number(document.getElementById("sqft").value);

    let floors =
        Number(document.getElementById("floors").value);

    let rate =
        Number(document.getElementById("rate").value);

    let totalArea =
        sqft * floors;

    let totalCost =
        totalArea * rate;
    
    let croreValue =
    (totalCost / 10000000).toFixed(2);

    document.getElementById("totalArea").innerHTML =
        totalArea.toLocaleString() + " Sqft";

    document.getElementById("totalCost").innerHTML =
        "₹" + totalCost.toLocaleString();

    document.getElementById("projectCrore").innerHTML =
    "₹" + croreValue + " Cr";

    document.getElementById("resultSection").style.display =
        "block";
}

</script>

</body>
</html>
